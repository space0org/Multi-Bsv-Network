version: '3'
services:
  lari-node:
    container_name: lari-node
    image: bitcoinsv/bitcoin-sv:1.0.8.beta
    volumes:
      - ./config/bitcoin.conf:/root/.bitcoin/bitcoin.conf
    ports:
      - '19332:19332'
      - '19333:19333'
      - '19444:19444'
    networks:
      - lari-network
    restart: always

networks:
  lari-network:
    driver: bridge
